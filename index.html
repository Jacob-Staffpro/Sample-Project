<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .calculator { background: #222; padding: 20px; border-radius: 12px; width: 260px; }
    #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 12px; border: none; border-radius: 6px; padding: 0 10px; box-sizing: border-box; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { height: 50px; font-size: 20px; border: none; border-radius: 6px; cursor: pointer; background: #444; color: white; }
    button:hover { background: #555; }
    .op { background: #f39c12; }
    .clear { background: #e74c3c; }
    .equals { background: #27ae60; grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="backspace()">⌫</button>
      <button class="op" onclick="append('/')">÷</button>
      <button class="op" onclick="append('*')">×</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="op" onclick="append('-')">−</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="op" onclick="append('+')">+</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('.')">.</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('%')">%</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function append(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function backspace() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        // Only allow numbers and math symbols
        if (!/^[0-9+\-*/.% ]+$/.test(display.value)) throw new Error();
        const result = Function('"use strict"; return (' + display.value + ')')();
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch {
        display.value = 'Error';
      }
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (/[0-9+\-*/.%]/.test(e.key)) append(e.key);
      else if (e.key === 'Enter') calculate();
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearDisplay();
    });
  </script>
</body>
</html>
